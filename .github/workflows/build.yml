name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            targets: >-
              x86_64-windows.win8-gnu
              x86_64-windows.win8-msvc
              x86-windows.win8-msvc
          - platform: linux
            targets: >-
              native
              x86_64-linux.2.6.4-gnu.2.16
              aarch64-linux.3.7-gnu.2.17
              x86_64-linux-musl
              aarch64-linux-musl
          - platform: macos
            targets: aarch64-macos.14.0 x86_64-macos.14.0
          - platform: ios
            targets: >-
              aarch64-ios.15.0
              aarch64-ios.15.0-simulator
              x86_64-ios.15.0-simulator
          - platform: android
            targets: >-
              aarch64-linux-android.26
              arm-linux-androideabi.26
              x86-linux-android.26
              x86_64-linux-android.26
          - platform: web
            targets: wasm32-emscripten
    env:
      ZIG_GLOBAL_CACHE_DIR: /tmp/zig-global
      ZIG_LOCAL_CACHE_DIR: /tmp/zig-build
      ZIG_LOCAL_PKG_DIR: /tmp/zig-pkg
    defaults:
      run:
        shell: bash
        working-directory: examples/clear
    steps:
      - uses: actions/checkout@v6
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
          use-cache: false
      # 按平台分别缓存下载包，避免不同 SDK 共用一个不能更新的缓存。
      - uses: actions/cache@v5
        with:
          path: ${{ env.ZIG_GLOBAL_CACHE_DIR }}/p
          key: zon-0.17.0-${{ matrix.platform }}-${{ hashFiles('**/build.zig.zon') }}
          restore-keys: zon-0.17.0-${{ matrix.platform }}-
      - name: Install Linux libraries
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xorg-dev libpulse-dev
      - name: Install Emscripten
        if: matrix.platform == 'web'
        run: zig build install-emsdk
      - name: Compile and link
        env:
          TARGETS: ${{ matrix.targets }}
        run: |
          for target in $TARGETS; do
            zig build -Dtarget="$target" -Doptimize=fast \
              --prefix "$RUNNER_TEMP/out/$target" --summary all
          done

  release:
    name: Publish
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --verify-tag --generate-notes --title "$TAG"
